name: CI

on:
  push:
    branches: [main, "restart/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Static JS syntax check
        run: find src/main/resources/static -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Maven verify
        run: mvn -B -ntp verify
